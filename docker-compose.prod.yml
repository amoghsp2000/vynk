# Production stack. Every secret is required (${VAR:?}) — compose refuses to
# start without it. Usage:
#   cp .env.example .env.prod  # fill in real values (see docs/DEPLOYMENT.md)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: parley-prod

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  TRUST_PROXY: "true"
  COOKIE_SECURE: "true"
  DATABASE_URL: postgres://parley:${POSTGRES_PASSWORD:?}@postgres:5432/parley
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?}
  # INCOMPLETE: no real SMS provider is implemented yet ('twilio' fails with 503).
  # For a closed staging demo only: OTP_PROVIDER=mock + ALLOW_MOCK_OTP_IN_PRODUCTION=true.
  OTP_PROVIDER: ${OTP_PROVIDER:-twilio}
  ALLOW_MOCK_OTP_IN_PRODUCTION: ${ALLOW_MOCK_OTP_IN_PRODUCTION:-false}
  CORS_ORIGINS: https://${DOMAIN:?}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://media.${DOMAIN}
  S3_BUCKET: parley-media
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
  STUN_URLS: stun:${TURN_HOST:?}:3478
  TURN_URLS: turn:${TURN_HOST}:3478?transport=udp,turn:${TURN_HOST}:3478?transport=tcp,turns:${TURN_HOST}:5349?transport=tcp
  TURN_SECRET: ${TURN_SECRET:?}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parley
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: parley
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parley -d parley"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/parley-media &&
        mc anonymous set none local/parley-media
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      # Certificate for turns: (TLS on 5349). Point these at your cert files.
      - ${TURN_TLS_CERT:?}:/etc/coturn/cert.pem:ro
      - ${TURN_TLS_KEY:?}:/etc/coturn/key.pem:ro
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --cert=/etc/coturn/cert.pem
      - --pkey=/etc/coturn/key.pem
      - --external-ip=${TURN_EXTERNAL_IP:?}
      - --min-port=49152
      - --max-port=65535
      - --realm=${DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --stale-nonce=600
      - --user-quota=12
      - --total-quota=1200
      # Never relay into private / internal networks (SSRF via TURN).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

  server:
    build: { context: ./server, target: runtime }
    restart: unless-stopped
    environment: *app-env
    expose: ["4000"]
    deploy:
      replicas: 2 # stateless: instances coordinate through Redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      retries: 10

  client:
    build: { context: ./client }
    restart: unless-stopped
    environment:
      API_UPSTREAM: server:4000
      MEDIA_ORIGIN: https://media.${DOMAIN}
      # Docker network range Caddy connects from.
      REAL_IP_FROM: 172.16.0.0/12
    depends_on:
      server: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [client, minio]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
