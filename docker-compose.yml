# Development stack. `docker compose up --build` runs everything.
# Values below marked "dev default" are NOT secrets — they only protect a local
# throwaway stack. Production uses docker-compose.prod.yml, which refuses to
# start unless real secrets are supplied through the environment.
name: parley

x-app-env: &app-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://parley:${POSTGRES_PASSWORD:-parley_dev_password}@postgres:5432/parley
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-0123456789abcdef}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-dev-only-otp-secret-change-me-0123456789abcdef}
  OTP_PROVIDER: mock
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:59000}
  S3_BUCKET: parley-media
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-parley_minio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-parley_minio_dev_password}
  STUN_URLS: ${STUN_URLS:-stun:localhost:3478}
  TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}
  TURN_SECRET: ${TURN_SECRET:-dev-only-turn-secret-change-me}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dev@parley.local}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parley
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parley_dev_password} # dev default
      POSTGRES_DB: parley
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parley -d parley"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["56379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parley_minio} # dev default
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parley_minio_dev_password} # dev default
    ports: ["59000:9000", "59001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: creates the private media bucket.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/parley-media &&
        mc anonymous set none local/parley-media
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parley_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parley_minio_dev_password}

  # STUN/TURN. Host networking because TURN relays need a wide UDP port range
  # and correct external addresses; Docker's userland proxy breaks that.
  coturn:
    image: coturn/coturn:4.6-alpine
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=parley.local
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-dev-only-turn-secret-change-me}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Dev only: lets two browsers on the same machine relay through loopback.
      # docker-compose.prod.yml denies private/loopback peers instead.
      - --allow-loopback-peers

  server:
    build: { context: ./server, target: runtime }
    environment:
      <<: *app-env
      PORT: "4000"
      # Only reachable through the client's nginx, which sets X-Forwarded-For.
      TRUST_PROXY: "true"
    # No published port: the API is served same-origin via the client container.
    expose: ["4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  client:
    build: { context: ./client }
    environment:
      API_UPSTREAM: server:4000
      MEDIA_ORIGIN: ${S3_PUBLIC_ENDPOINT:-http://localhost:59000}
    ports: ["8080:80"]
    depends_on:
      server: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
